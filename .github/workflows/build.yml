name: build

# Rebuilds dist/UIW.lua from src/ on every push, so the file the loader
# downloads always matches the source in the repo.

on:
  push:
    branches: [main, experiment-flatmap, stable-v44.22]
    paths:
      - 'src/**'
      - 'manifest.txt'
      - 'build.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Join the parts
        run: python build.py
      - name: Commit dist if it changed
        run: |
          if [ -n "$(git status --porcelain dist)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add dist
            git commit -m "Build dist from src [skip ci]"
            git push
          else
            echo "dist is already up to date"
          fi
